{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-12">
        <div class="card p-4 rounded-4 shadow">
            <h3 class="text-center fw-bold text-warning mb-2">💎 สมัครสมาชิก VIP</h3>
            <p class="text-center text-light opacity-75 small">สแกน QR Code เพื่อโอนเงินเข้าเบอร์พร้อมเพย์แอดมิน</p>
            <div class="text-center my-4">
                <img src="https://promptpay.io" class="img-fluid rounded-3 border border-light p-2 bg-white shadow-sm" style="max-width: 250px;" alt="PromptPay QR">
                <h4 class="mt-3 fw-bold text-success fs-3">199.00 บาท</h4>
            </div>
            <form method="POST" enctype="multipart/form-data" class="mt-2">
                <div class="mb-4">
                    <label class="form-label fw-bold opacity-75">แนบรูปภาพสลิปการโอนเงิน</label>
                    <input class="form-control form-control-lg bg-dark text-white border-secondary" type="file" name="slip" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 rounded-3 fs-5">ยืนยันการแจ้งโอนเงิน</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
