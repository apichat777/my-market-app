{% extends 'base.html' %}
{% block content %}
<div class="card p-4 rounded-4 shadow">
    <h3 class="fw-bold text-danger mb-4">⚙️ แผงควบคุมแอดมิน</h3>
    <h5 class="fw-bold text-secondary mb-3">สลิปลูกค้าที่รออนุมัติ VIP</h5>
    <div class="table-responsive">
        <table class="table table-dark align-middle m-0">
            <thead>
                <tr class="text-secondary border-secondary">
                    <th>ชื่อผู้ใช้</th>
                    <th>หลักฐาน</th>
                    <th>คำสั่ง</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr class="border-secondary">
                    <td class="fw-bold">{{ u.username }}</td>
                    <td><a href="/static/uploads/{{ u.slip_path }}" target="_blank" class="btn btn-sm btn-outline-info">เปิดดูสลิป</a></td>
                    <td>
                        <form method="POST" class="d-inline">
                            <input type="hidden" name="approve_id" value="{{ u.id }}">
                            <button type="submit" class="btn btn-sm btn-success px-4 fw-bold">กดอนุมัติสิทธิ์ VIP</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-center py-4 text-muted small">ไม่มีสลิปที่รอตรวจสอบในขณะนี้</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
